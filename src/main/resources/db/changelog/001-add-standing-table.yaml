databaseChangeLog:
  - changeSet:
      id: 1
      author: Don
      changes:
        - createTable:
            tableName: standings
            columns:
              - column:
                  name: team_id
                  type: INTEGER
                  constraints:
                    primaryKey: true
              - column:
                  name: ordinal
                  type: INTEGER
                  constraints:
                    primaryKey: true
              - column:
                  name: displayed_rank
                  type: INTEGER
                  defaultValue: -1
                  constraints:
                    nullable: false
              - column:
                  name: club_name
                  type: TEXT
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: played_games
                  type: INTEGER
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: won_points
                  type: INTEGER
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: lost_points
                  type: INTEGER
                  defaultValue: 0
                  constraints:
                    nullable: false